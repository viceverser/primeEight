name: PrimeEight CLAP builds
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: PrimeEight-Windows-x64-CLAP
          - os: ubuntu-24.04
            artifact: PrimeEight-Linux-x64-CLAP
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Debug tests
        shell: bash
        run: cmake -S . -B build-debug -DPRIMEEIGHT_BUILD_CLAP=ON -DPRIMEEIGHT_CLAP_INCLUDE_DIR="${{ github.workspace }}/vendor/clap-main/include" -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee debug-configure.log
      - name: Build Debug tests
        shell: bash
        run: cmake --build build-debug --config Debug --parallel 2 2>&1 | tee debug-build.log
      - name: Configure distributable Release plugin
        shell: bash
        run: cmake -S . -B build-release -DPRIMEEIGHT_BUILD_CLAP=ON -DPRIMEEIGHT_CLAP_INCLUDE_DIR="${{ github.workspace }}/vendor/clap-main/include" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build distributable Release plugin
        run: cmake --build build-release --config Release --target PrimeEight_CLAP --parallel 2
      - name: Verify Release plugin loads on build runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-release -Recurse -Filter 'PrimeEight_CLAP.clap' | Select-Object -First 1
          if (-not $plugin) { throw 'Release CLAP binary missing' }
          $loader = Get-ChildItem -Path build-debug -Recurse -Filter 'primeeight_clap_windows_loading_test.exe' | Select-Object -First 1
          if (-not $loader) { throw 'Windows loader test missing' }
          & $loader.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Release CLAP failed native LoadLibrary test' }
      - name: Upload Release CLAP plugin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build-release/**/PrimeEight_CLAP.clap
          if-no-files-found: error
      - name: Run native Debug tests (bounded, verbose)
        shell: bash
        run: |
          ctest --test-dir build-debug -C Debug --output-on-failure --verbose --timeout 60 --output-log debug-ctest.log
      - name: Upload Debug test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Debug-Diagnostics
          path: |
            debug-configure.log
            debug-build.log
            debug-ctest.log
            build-debug/Testing/Temporary/LastTest.log
            build-debug/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  juce-editor-preview:
    name: JUCE editor preview (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git vendor/juce
      - name: Configure JUCE preview
        shell: pwsh
        run: |
          cmake -S . -B build-juce -G "Visual Studio 17 2022" -A x64 -DPRIMEEIGHT_BUILD_JUCE_PREVIEW=ON -DPRIMEEIGHT_JUCE_DIR="$PWD/vendor/juce" 2>&1 | Tee-Object -FilePath juce-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build JUCE preview
        shell: pwsh
        run: |
          cmake --build build-juce --config Release --target PrimeEight_JUCE_Preview --parallel 2 2>&1 | Tee-Object -FilePath juce-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload JUCE build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrimeEight-JUCE-Windows-Build-Logs
          path: |
            juce-configure.log
            juce-build.log
          if-no-files-found: warn
      - name: Upload JUCE preview executable
        uses: actions/upload-artifact@v4
        with:
          name: PrimeEight-JUCE-Windows-Preview
          path: build-juce/**/PrimeEight JUCE Preview.exe
          if-no-files-found: error

  juce-clap-experimental:
    name: Experimental JUCE CLAP (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE and Surge CLAP shim
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git vendor/juce
          git clone https://github.com/surge-synthesizer/sst-clap-helpers.git vendor/sst-clap-helpers
          git -C vendor/sst-clap-helpers checkout f17567a8166a50bfb50ddc9acca7e77c72e6096f
      - name: Configure experimental plugin
        shell: pwsh
        run: |
          cmake -S . -B build-juce-clap -G "Visual Studio 17 2022" -A x64 -DPRIMEEIGHT_BUILD_CLAP=ON -DPRIMEEIGHT_BUILD_CLAP_JUCE_SHIM=ON -DPRIMEEIGHT_CLAP_INCLUDE_DIR="$PWD/vendor/clap-main/include" -DPRIMEEIGHT_JUCE_DIR="$PWD/vendor/juce" -DPRIMEEIGHT_SST_CLAP_HELPERS_DIR="$PWD/vendor/sst-clap-helpers" 2>&1 | Tee-Object -FilePath juce-clap-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build experimental plugin
        shell: pwsh
        run: |
          cmake --build build-juce-clap --config Release --target PrimeEight_CLAP --parallel 2 2>&1 | Tee-Object -FilePath juce-clap-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload experimental build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrimeEight-Experimental-JUCE-CLAP-Logs
          path: |
            juce-clap-configure.log
            juce-clap-build.log
          if-no-files-found: warn
      - name: Upload experimental JUCE CLAP
        uses: actions/upload-artifact@v4
        with:
          name: PrimeEight-Experimental-JUCE-CLAP
          path: build-juce-clap/**/PrimeEight_CLAP.clap
          if-no-files-found: error
