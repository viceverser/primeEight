name: PrimeEight CLAP builds
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: PrimeEight-Windows-x64-CLAP
          - os: ubuntu-24.04
            artifact: PrimeEight-Linux-x64-CLAP
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DPRIMEEIGHT_BUILD_CLAP=ON -DPRIMEEIGHT_CLAP_INCLUDE_DIR="${{ github.workspace }}/vendor/clap-main/include" -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Run native tests
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Upload compiled CLAP directly
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/**/PrimeEight_CLAP.clap
          if-no-files-found: error
